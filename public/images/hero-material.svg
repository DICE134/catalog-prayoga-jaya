<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-label="Ilustrasi sementara material bangunan">
  <!-- PLACEHOLDER HERO — ganti dengan foto asli toko/material (misalnya hero.jpg) -->
  <rect width="1200" height="500" fill="#5d6d7e"/>
  <!-- tumpukan bata -->
  <g fill="#a04000" stroke="#7b3200" stroke-width="3">
    <rect x="80" y="380" width="120" height="50"/><rect x="200" y="380" width="120" height="50"/><rect x="320" y="380" width="120" height="50"/>
    <rect x="140" y="330" width="120" height="50"/><rect x="260" y="330" width="120" height="50"/>
    <rect x="200" y="280" width="120" height="50"/>
  </g>
  <!-- karung semen -->
  <g fill="#d5d8dc" stroke="#909497" stroke-width="3">
    <rect x="560" y="330" width="170" height="100" rx="18"/><rect x="740" y="330" width="170" height="100" rx="18"/>
    <rect x="650" y="235" width="170" height="100" rx="18"/>
  </g>
  <!-- besi batangan -->
  <g stroke="#2c3e50" stroke-width="10" stroke-linecap="round">
    <line x1="960" y1="430" x2="1140" y2="250"/><line x1="985" y1="430" x2="1160" y2="255"/><line x1="1010" y1="430" x2="1180" y2="260"/>
  </g>
  <rect y="430" width="1200" height="70" fill="#34495e"/>
  <text x="600" y="120" font-family="Arial, sans-serif" font-size="30" fill="#ffffff" fill-opacity=".55" text-anchor="middle">Gambar sementara — ganti dengan foto asli</text>
</svg>
