<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-label="Foto produk belum tersedia">
  <!-- PLACEHOLDER: dipakai jika produk belum punya foto. Ganti dengan foto asli lewat halaman admin. -->
  <rect width="600" height="600" fill="#e9ecef"/>
  <!-- tumpukan karung/bata sederhana -->
  <g fill="#adb5bd">
    <rect x="170" y="330" width="120" height="70" rx="10"/>
    <rect x="310" y="330" width="120" height="70" rx="10"/>
    <rect x="240" y="250" width="120" height="70" rx="10"/>
  </g>
  <rect x="150" y="400" width="300" height="12" rx="6" fill="#ced4da"/>
  <text x="300" y="200" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#6c757d">Foto belum tersedia</text>
</svg>
